<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
</head>
<body>
    <table>
        <tr>
            <th>NAME</th>
            <th>hight in cm</th>
            <th>hight in inch</th>
            <!-- this th tag is for headinng which is bold  -->
        </tr>
        
            <tr>
                <td>Ram</td>
                <td>165</td>
                <td>67.5</td>
                <!-- this td tag is for normal data in table -->
             </tr>
             <tr>
                <td>Raja</td>
                <td>180</td>
                <td>73.5</td>
             </tr>
             <tr>
                <td>Mohan</td>
                <td>172</td>
                <td>70</td>
             </tr>
    </table>
    <hr>
    <table>
    <tr>
        <th rowspan="2">Names</th>
        <!-- rowspan is for the second out put  -->
        <th colspan="2">Hight</th>
        <!-- columnspan if for the second out put -->
    </tr>
    <tr>
        <th>in cms</th>
        <th>in inch</th>
    </tr>
                <tr>
                <td>Ram</td>
                <td>165</td>
                <td>67.5</td>
                <!-- this td tag is for normal data in table -->
             </tr>
             <tr>
                <td>Raja</td>
                <td>180</td>
                <td>73.5</td>
             </tr>
             <tr>
                <td>Mohan</td>
                <td>172</td>
                <td>70</td>
             </tr>
    </table>
</body>
</html>

<!-- tr is for defining a row in table  -->
<!-- The td tag defines a standard data cell in an HTML table. -->
<!-- The th tag defines a header cell in an HTML table. -->
